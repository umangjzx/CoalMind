[project]
name = "coalmind-backend"
version = "0.1.0"
description = "CoalMind AI — document-intelligence backend for CMPDI/CIL (SIH 26023)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "minio>=7.2",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "fastembed>=0.4",
    "anthropic>=0.39",
    "arq>=0.26",
    "tenacity>=9.0",
    # --- M1: ingestion & extraction ---
    "pdfplumber>=0.11",
    "pypdf>=5.1",
    "pytesseract>=0.3.13",
    "pillow>=10.4",
    "spacy>=3.8",
    "en-core-web-sm",
    "python-dateutil>=2.9",
    # --- M3: report generation ---
    "jinja2>=3.1",
    "xhtml2pdf>=0.2.16",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    # sample-corpus generation (scripts/gen_sample_corpus.py)
    "reportlab>=4.2",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/File()/Form() in argument defaults is the intended idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
