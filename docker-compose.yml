# CoalMind AI — local development infrastructure.
#   make up      -> start   |   make down -> stop   |   make logs -> tail
#
# App processes (FastAPI, Vite) run on the host for fast reload; only the
# stateful services live in containers.
name: coalmind

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coalmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coalmind}
      POSTGRES_DB: ${POSTGRES_DB:-coalmind}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coalmind} -d ${POSTGRES_DB:-coalmind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-coalmind}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-coalmind-secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the documents bucket, then exit.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-coalmind} ${MINIO_ROOT_PASSWORD:-coalmind-secret} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-coalmind-documents} &&
      mc anonymous set none local/${MINIO_BUCKET:-coalmind-documents} &&
      echo 'bucket ready'
      "

volumes:
  pgdata:
  miniodata:
